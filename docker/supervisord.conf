[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --protected-mode yes --dir /data/redis --appendonly yes --appendfsync everysec --maxmemory %(ENV_RSSHUB_REDIS_MAXMEMORY)s --maxmemory-policy allkeys-lru
user=redis
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:rsshub]
directory=/app
command=/usr/bin/dumb-init -- npm run start
user=node
environment=HOME="/home/node"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:newsscope]
directory=/app
command=/usr/local/bin/newsscope
user=node
environment=HOME="/home/node"
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:rsshub-adapter]
directory=/opt/newsscope/collector/RSSHub
command=/usr/bin/python3 /opt/newsscope/collector/RSSHub/rsshub_collector.py
user=node
environment=HOME="/home/node"
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
